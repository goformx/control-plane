name: Site contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Bootstrap commands intentionally run in local mode against an ephemeral
      # CI database; production mode requires an already activated config generation.
      APP_ENV: local
      APP_URL: https://goformx.test
      WAASEYAA_APP_SECRET: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WAASEYAA_JWT_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/waaseyaa migrate
      - run: php vendor/bin/waaseyaa schema:sync
      - run: .ci/site-verify
