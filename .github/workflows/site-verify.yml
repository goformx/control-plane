name: Site contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Bootstrap commands intentionally run in local mode against an ephemeral
      # CI database; production mode requires an already activated config generation.
      APP_ENV: local
      APP_URL: https://goformx.test
      GOFORMX_PUBLIC_API_URL: https://api.goformx.test
      WAASEYAA_APP_SECRET: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WAASEYAA_JWT_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: fileinfo, pdo_sqlite, sqlite3, sodium, zip, mbstring, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npx --no-install playwright install --with-deps chromium
      - run: composer validate --strict
      - run: composer audit --no-interaction
      - run: php vendor/bin/waaseyaa install:init
      - name: Lint application PHP
        run: |
          find config src tests bin/maintenance -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/maintenance/goformx-generate-signing-key
      - run: php vendor/bin/phpunit --no-coverage
      - run: .ci/site-verify
