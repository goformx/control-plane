name: Cross-service boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary-rehearsal:
    name: boundary (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Persistent per-IP rate limits are real security state. Each rehearsal
    # gets its own databases and servers instead of consuming another's budget.
    strategy:
      fail-fast: false
      matrix:
        suite: [http, browser, integrations, authorization, failures]
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: goformx
          POSTGRES_USER: goformx
          POSTGRES_PASSWORD: cross-service-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goformx -d goformx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: https://goformx.com
      WAASEYAA_APP_SECRET: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WAASEYAA_JWT_SECRET: cross-service-only-not-production
      WAASEYAA_DEV_FALLBACK_ACCOUNT: 'false'
      GOFORMX_API_URL: ${{ matrix.suite == 'failures' && 'http://127.0.0.1:18093' || 'http://127.0.0.1:18090' }}
      GOFORMX_ASSERTION_ISSUER: https://goformx.com
      GOFORMX_ASSERTION_AUDIENCE: https://api.goformx.com
      GOFORMX_CROSS_SERVICE_UI_URL: http://127.0.0.1:18091
      GOFORMX_PUBLIC_API_URL: http://127.0.0.1:18090
      GOFORMX_WEBHOOK_RECEIVER_URL: https://receiver.goformx.test/hooks/goformx
      GOFORMX_WEBHOOK_RECEIVER_CONTROL_URL: http://127.0.0.1:18092
      GOFORMX_FAULT_PROXY_CONTROL_URL: http://127.0.0.1:18094
      GOFORMX_WEBHOOK_CURRENT_SECRET: ${{ matrix.suite == 'integrations' && 'cross-service-current-signing-key-123456' || '' }}
      GOFORMX_WEBHOOK_PREVIOUS_SECRET: ${{ matrix.suite == 'integrations' && 'cross-service-previous-signing-key-123456' || '' }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select disposable runtime paths
        run: |
          echo "WAASEYAA_DB=$RUNNER_TEMP/control-plane.sqlite" >> "$GITHUB_ENV"
          echo "GOFORMX_CROSS_SERVICE_LOG=$RUNNER_TEMP/goformx-api.log" >> "$GITHUB_ENV"
          echo "GOFORMX_CROSS_SERVICE_UI_LOG=$RUNNER_TEMP/control-plane.log" >> "$GITHUB_ENV"
          echo "GOFORMX_WEBHOOK_RECEIVER_LOG=$RUNNER_TEMP/webhook-receiver.log" >> "$GITHUB_ENV"
          echo "GOFORMX_WEBHOOK_RECEIVER_CA=$RUNNER_TEMP/webhook-receiver-ca.pem" >> "$GITHUB_ENV"
          echo "GOFORMX_WEBHOOK_RECEIVER_CERT=$RUNNER_TEMP/webhook-receiver.pem" >> "$GITHUB_ENV"
          echo "GOFORMX_WEBHOOK_RECEIVER_KEY=$RUNNER_TEMP/webhook-receiver-key.pem" >> "$GITHUB_ENV"
          echo "GOFORMX_WEBHOOK_RECEIVER_PID_FILE=$RUNNER_TEMP/webhook-receiver.pid" >> "$GITHUB_ENV"
          echo "GOFORMX_FAULT_PROXY_LOG=$RUNNER_TEMP/management-fault-proxy.log" >> "$GITHUB_ENV"

      - name: Checkout the accepted Go data-plane boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: goformx/goformx
          ref: c904fe1e0d70b7af6a62ebe2704582510ce8f1ae
          path: .ci/goformx

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: fileinfo, pdo_pgsql, pdo_sqlite, sqlite3, sodium, zip, mbstring, xml
          coverage: none

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .ci/goformx/goforms/go.mod
          cache: true
          cache-dependency-path: .ci/goformx/goforms/go.sum

      - name: Bootstrap the Waaseyaa application
        run: |
          composer install --no-interaction --prefer-dist
          php vendor/bin/waaseyaa install:init

      - name: Set up the pinned browser test runtime
        if: matrix.suite != 'http'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: matrix.suite != 'http'
      - run: npx --no-install playwright install --with-deps chromium
        if: matrix.suite != 'http'

      - name: Build the pinned receiver verifier
        if: matrix.suite == 'integrations'
        working-directory: .ci/goformx/goforms
        run: |
          npm ci --ignore-scripts
          npm run contract:build

      - name: Start a trusted public-address receiver fixture
        if: matrix.suite == 'integrations'
        run: |
          echo "::add-mask::$GOFORMX_WEBHOOK_CURRENT_SECRET"
          echo "::add-mask::$GOFORMX_WEBHOOK_PREVIOUS_SECRET"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/webhook-receiver-ca-key.pem" \
            -out "$GOFORMX_WEBHOOK_RECEIVER_CA" -subj '/CN=GoFormX cross-service receiver CA' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$GOFORMX_WEBHOOK_RECEIVER_KEY" -out "$RUNNER_TEMP/webhook-receiver.csr" \
            -subj '/CN=receiver.goformx.test' >/dev/null 2>&1
          printf 'subjectAltName=DNS:receiver.goformx.test\nextendedKeyUsage=serverAuth\n' > "$RUNNER_TEMP/webhook-receiver.ext"
          openssl x509 -req -days 1 -in "$RUNNER_TEMP/webhook-receiver.csr" \
            -CA "$GOFORMX_WEBHOOK_RECEIVER_CA" -CAkey "$RUNNER_TEMP/webhook-receiver-ca-key.pem" \
            -CAcreateserial -extfile "$RUNNER_TEMP/webhook-receiver.ext" \
            -out "$GOFORMX_WEBHOOK_RECEIVER_CERT" >/dev/null 2>&1
          echo '8.8.8.8 receiver.goformx.test' | sudo tee -a /etc/hosts >/dev/null
          # A public-classified address is intentional: Go's production SSRF
          # policy rejects loopback/private peers and revalidates on every dial.
          sudo ip address add 8.8.8.8/32 dev lo
          : > "$GOFORMX_WEBHOOK_RECEIVER_PID_FILE"
          sudo env \
            GOFORMX_BROWSER_REHEARSAL=1 \
            GOFORMX_WEBHOOK_RECEIVER_HOST=8.8.8.8 \
            GOFORMX_WEBHOOK_VERIFIER="$GITHUB_WORKSPACE/.ci/goformx/goforms/.contract-client/examples/webhook-receiver.mjs" \
            GOFORMX_WEBHOOK_RECEIVER_CERT="$GOFORMX_WEBHOOK_RECEIVER_CERT" \
            GOFORMX_WEBHOOK_RECEIVER_KEY="$GOFORMX_WEBHOOK_RECEIVER_KEY" \
            GOFORMX_WEBHOOK_RECEIVER_PID_FILE="$GOFORMX_WEBHOOK_RECEIVER_PID_FILE" \
            GOFORMX_WEBHOOK_CURRENT_SECRET="$GOFORMX_WEBHOOK_CURRENT_SECRET" \
            GOFORMX_WEBHOOK_PREVIOUS_SECRET="$GOFORMX_WEBHOOK_PREVIOUS_SECRET" \
            "$(command -v node)" tests/BrowserLive/fixtures/webhook-receiver.mjs \
            > "$GOFORMX_WEBHOOK_RECEIVER_LOG" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$GOFORMX_WEBHOOK_RECEIVER_CONTROL_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Webhook receiver did not become ready. Receiver logs are not published."
          exit 1

      - name: Generate ephemeral assertion custody
        run: |
          custody="$(php bin/maintenance/goformx-generate-signing-key ci-cross-service)"
          while IFS='=' read -r name value; do
            if [[ "$name" == "GOFORMX_ASSERTION_SIGNING_SEED" ]]; then
              echo "::add-mask::$value"
            fi
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done <<< "$custody"

      - name: Generate ephemeral webhook custody
        if: matrix.suite == 'integrations' || matrix.suite == 'failures'
        run: |
          webhook_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$webhook_key"
          printf 'GOFORMX_WEBHOOK_KEYRING={"ci":"%s"}\n' "$webhook_key" >> "$GITHUB_ENV"

      - name: Migrate the disposable GoFormX database
        working-directory: .ci/goformx/goforms
        run: >-
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          -path migrations/postgresql
          -database "postgres://goformx:cross-service-only@127.0.0.1:5432/goformx?sslmode=disable"
          up

      - name: Start the real GoFormX API
        working-directory: .ci/goformx/goforms
        env:
          APP_ENVIRONMENT: test
          APP_DEBUG: 'false'
          APP_LOG_LEVEL: info
          APP_HOST: 127.0.0.1
          APP_PORT: '18090'
          DB_DRIVER: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: goformx
          DB_USERNAME: goformx
          DB_PASSWORD: cross-service-only
          DB_SSL_MODE: disable
          FIRST_PARTY_ASSERTION_ENABLED: 'true'
          FIRST_PARTY_ASSERTION_ISSUER: https://goformx.com
          FIRST_PARTY_ASSERTION_AUDIENCE: https://api.goformx.com
          WEBHOOK_ENABLED: ${{ (matrix.suite == 'integrations' || matrix.suite == 'failures') && 'true' || 'false' }}
          WEBHOOK_ACTIVE_ENCRYPTION_KEY_ID: ${{ (matrix.suite == 'integrations' || matrix.suite == 'failures') && 'ci' || '' }}
          WEBHOOK_POLL_INTERVAL: ${{ matrix.suite == 'integrations' && '250ms' || '' }}
          WEBHOOK_REQUEST_TIMEOUT: ${{ matrix.suite == 'integrations' && '3s' || '' }}
          WEBHOOK_LOCK_TIMEOUT: ${{ matrix.suite == 'integrations' && '5s' || '' }}
          WEBHOOK_MAX_ATTEMPTS: ${{ matrix.suite == 'integrations' && '2' || '' }}
          WEBHOOK_BACKOFF_BASE: ${{ matrix.suite == 'integrations' && '1s' || '' }}
          WEBHOOK_BACKOFF_MAX: ${{ matrix.suite == 'integrations' && '1s' || '' }}
          GOFORMX_BOUNDARY_SUITE: ${{ matrix.suite }}
        run: |
          go build -o "$RUNNER_TEMP/goformx-api" ./cmd/api
          if [[ "$GOFORMX_BOUNDARY_SUITE" == "integrations" || "$GOFORMX_BOUNDARY_SUITE" == "failures" ]]; then
            export WEBHOOK_ENCRYPTION_KEYRING="$GOFORMX_WEBHOOK_KEYRING"
          fi
          if [[ "$GOFORMX_BOUNDARY_SUITE" == "integrations" ]]; then
            export SSL_CERT_FILE="$GOFORMX_WEBHOOK_RECEIVER_CA"
          fi
          FIRST_PARTY_ASSERTION_JWKS_SNAPSHOT="$GOFORMX_DATA_PLANE_JWKS_SNAPSHOT" \
            "$RUNNER_TEMP/goformx-api" > "$GOFORMX_CROSS_SERVICE_LOG" 2>&1 &
          echo "GOFORMX_API_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "GoFormX API did not become ready. Raw credential-adjacent logs are not published."
          exit 1

      - name: Start the response-loss fault proxy
        if: matrix.suite == 'failures'
        env:
          GOFORMX_BROWSER_REHEARSAL: '1'
          GOFORMX_FAULT_PROXY_UPSTREAM: http://127.0.0.1:18090
        run: |
          node tests/BrowserLive/fixtures/management-fault-proxy.mjs > "$GOFORMX_FAULT_PROXY_LOG" 2>&1 &
          echo "GOFORMX_FAULT_PROXY_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$GOFORMX_FAULT_PROXY_CONTROL_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Management fault proxy did not become ready. Proxy logs are not published."
          exit 1

      - name: Start the real Waaseyaa HTTP entry point
        run: |
          php -S 127.0.0.1:18091 -t public public/index.php > "$GOFORMX_CROSS_SERVICE_UI_LOG" 2>&1 &
          echo "GOFORMX_UI_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18091/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Waaseyaa did not become ready. Raw credential-adjacent logs are not published."
          exit 1

      - name: Exercise the authenticated browser-to-data-plane boundary
        if: matrix.suite == 'http'
        run: php vendor/bin/phpunit tests/CrossService/AuthenticatedManagementBoundaryTest.php --no-coverage

      - name: Exercise the rendered human workflow against both real services
        if: matrix.suite == 'browser'
        env:
          GOFORMX_BROWSER_REHEARSAL: '1'
        run: npm run test:live

      - name: Exercise the rendered integration lifecycle against both real services
        if: matrix.suite == 'integrations'
        env:
          GOFORMX_BROWSER_REHEARSAL: '1'
          GOFORMX_EVIDENCE_DSN: pgsql:host=127.0.0.1;port=5432;dbname=goformx
          GOFORMX_EVIDENCE_USER: goformx
          GOFORMX_EVIDENCE_PASSWORD: cross-service-only
        run: npm run test:live:integrations

      - name: Exercise live integration authorization changes
        if: matrix.suite == 'authorization'
        env:
          GOFORMX_BROWSER_REHEARSAL: '1'
          GOFORMX_EVIDENCE_DSN: pgsql:host=127.0.0.1;port=5432;dbname=goformx
          GOFORMX_EVIDENCE_USER: goformx
          GOFORMX_EVIDENCE_PASSWORD: cross-service-only
        run: npm run test:live:authorization

      - name: Exercise committed mutations with lost responses
        if: matrix.suite == 'failures'
        env:
          GOFORMX_BROWSER_REHEARSAL: '1'
          GOFORMX_EVIDENCE_DSN: pgsql:host=127.0.0.1;port=5432;dbname=goformx
          GOFORMX_EVIDENCE_USER: goformx
          GOFORMX_EVIDENCE_PASSWORD: cross-service-only
        run: npm run test:live:failures

      - name: Rehearse configured custody rotation and real process recovery
        if: matrix.suite == 'http'
        env:
          GOFORMX_CUSTODY_REHEARSAL: '1'
        run: |
          GOFORMX_ROTATION_API_BINARY="$RUNNER_TEMP/goformx-api" \
          GOFORMX_ROTATION_DATA_PLANE_ROOT="$GITHUB_WORKSPACE/.ci/goformx/goforms" \
            php vendor/bin/phpunit tests/CrossService/CustodyRotationTest.php --no-coverage

      - name: Stop ephemeral HTTP servers
        if: always()
        run: |
          if [[ -n "${GOFORMX_API_PID:-}" ]]; then
            kill "$GOFORMX_API_PID" 2>/dev/null || true
          fi
          if [[ -n "${GOFORMX_UI_PID:-}" ]]; then
            kill "$GOFORMX_UI_PID" 2>/dev/null || true
          fi
          if [[ -n "${GOFORMX_FAULT_PROXY_PID:-}" ]]; then
            kill "$GOFORMX_FAULT_PROXY_PID" 2>/dev/null || true
          fi
          if [[ -f "${GOFORMX_WEBHOOK_RECEIVER_PID_FILE:-}" ]]; then
            receiver_pid="$(cat "$GOFORMX_WEBHOOK_RECEIVER_PID_FILE")"
            if [[ "$receiver_pid" =~ ^[1-9][0-9]*$ ]]; then
              sudo kill "$receiver_pid" 2>/dev/null || true
            fi
          fi
          if [[ "${{ matrix.suite }}" == "integrations" ]]; then
            sudo ip address del 8.8.8.8/32 dev lo 2>/dev/null || true
            sudo sed -i '/receiver\.goformx\.test/d' /etc/hosts || true
          fi

  authenticated-boundary:
    # Preserve the required-check name; both real-service rehearsals must pass.
    needs: boundary-rehearsal
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every boundary rehearsal
        env:
          REHEARSAL_RESULT: ${{ needs.boundary-rehearsal.result }}
        run: test "$REHEARSAL_RESULT" = success
