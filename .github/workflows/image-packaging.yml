name: Image packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  context-and-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images and scan every layer for synthetic local data
        run: python3 scripts/verify-image-context.py
      - name: Check PHP runtime requirements
        run: docker run --rm goformx-control-plane-production:context-probe composer check-platform-reqs --no-dev
