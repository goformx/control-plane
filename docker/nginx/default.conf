server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Web-container liveness only. Deployment readiness must probe PHP and DB.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /favicon.svg { try_files $uri =404; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri @php; }

    location @php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # This image is for the HTTPS origin behind the trusted host ingress.
        # Do not pass a client-controlled forwarding header to PHP.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass control-plane-php:9000;
        fastcgi_read_timeout 30s;
    }
}
